<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snark_00</title>
<style>
/* Colours and scene from EDITOR_35; layout by the Cripp rules (tools left, numbers below, scene as large as possible). */
:root{
  --bg:#f4f5f7;--panel:#ffffff;--text:#1d2330;--muted:#5f6b7d;--line:#d8dde5;
  --accent:#2f6fde;--accent-text:#ffffff;--ok:#1f8a4c;--err:#c0392b;--warn:#b7791f;--view:#e9ecf1;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
[data-theme="dark"]{
  --bg:#12151b;--panel:#1b2029;--text:#e6eaf1;--muted:#9aa5b5;--line:#2e3542;
  --accent:#5b8ff0;--accent-text:#0d1117;--ok:#4cc27e;--err:#ef6b5c;--warn:#e0b252;--view:#161a21;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:29px 1fr auto;height:100dvh;overflow:hidden;
  background:var(--bg);color:var(--text);font:13px/1.4 system-ui,"Segoe UI","Noto Sans Georgian",Sylfaen,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font:700 12px var(--mono);color:var(--muted);padding:0 8px 0 2px}
details.menu{position:relative;height:100%;display:flex;align-items:center}
details.menu>summary{list-style:none;cursor:pointer;padding:2px 11px;border:1px solid transparent;border-radius:2px;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover,details.menu[open]>summary{background:var(--bg);border-color:var(--line)}
.items{position:absolute;top:27px;left:0;min-width:230px;background:var(--panel);border:1px solid var(--line);box-shadow:2px 4px 10px #0003;padding:3px;z-index:30;border-radius:2px}
.items button,.items label{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;border:0;padding:5px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.items button:hover,.items label:hover{background:var(--accent);color:#fff}
.items hr{border:0;border-top:1px solid var(--line);margin:3px 4px}
#status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/22px var(--mono);color:var(--muted);padding:0 10px;border-left:1px solid var(--line);margin-left:4px}
#status .ok{color:var(--ok)} #status .bad{color:var(--err)}
.top-right{display:flex;align-items:center;gap:2px}
.top-right button,.top-right select{height:24px;padding:1px 8px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer}
.top-right button:hover,.top-right select:hover{border-color:var(--line);background:var(--bg)}
.top-right button.on{border-color:var(--accent);color:var(--accent)}
.lbl{font-size:11px;color:var(--muted);padding-left:6px}
#tools{grid-row:2;display:flex;flex-direction:column;gap:3px;padding:5px 3px;background:var(--panel);border-right:1px solid var(--line)}
#tools button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0}
#tools button:hover{border-color:var(--accent);color:var(--accent)}
#tools button:disabled{opacity:.35;cursor:default;border-color:var(--line);color:inherit}
#tools hr{width:100%;border:0;border-top:1px solid var(--line);margin:2px 0}
#tools svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#viewWrap{grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--view)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#objectStrip{position:absolute;top:6px;left:6px;width:170px;max-height:calc(100% - 12px);display:flex;flex-direction:column;gap:2px;overflow:auto;z-index:4}
.chip{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px;line-height:17px;border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sel{border-color:#c9a300;box-shadow:inset 0 0 0 1px #ffd62e;background:#fff6cc;color:#24211c}
[data-theme="dark"] .chip.sel{background:#4a4110;color:#ffe9a0}
.chip.foreign{cursor:default;color:var(--muted);font-style:italic}
.chip i{font-style:normal;color:var(--muted);font-size:10px}
.chip input{width:100%;font-size:11px;padding:0 3px;border:1px solid var(--accent);border-radius:2px;background:var(--panel)}
#side{grid-row:2;width:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0;overflow:hidden}
#side.open{width:min(400px,38vw)}
.tabs{display:flex;gap:2px;padding:4px 6px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:4px 12px;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;background:transparent;cursor:pointer;color:var(--muted)}
.tabs button.on{border-color:var(--line);background:var(--bg);color:var(--text);font-weight:600}
.tabs .sp{flex:1}
.tabs .x{color:var(--muted)}
.pane{flex:1;min-height:0;display:none;flex-direction:column}
.pane.on{display:flex}
#text{flex:1;min-height:0;width:100%;resize:none;border:0;padding:8px 10px;font:12px/1.45 var(--mono);background:var(--bg);color:var(--text);white-space:pre;overflow:auto;outline:0;tab-size:2}
.bar{display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.bar button{padding:3px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);cursor:pointer;color:var(--text)}
.bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar button:disabled{opacity:.4;cursor:default}
#issues{max-height:30%;overflow:auto;font:11px/1.45 var(--mono);padding:4px 10px;border-top:1px solid var(--line)}
#issues div{white-space:pre-wrap}
#issues .hd{color:var(--muted);font-weight:600;margin-top:2px}
.lv-error{color:var(--err)} .lv-boojum{color:var(--err);font-weight:700} .lv-warn{color:var(--warn)} .lv-info{color:var(--muted)}
#memory{flex:1;min-height:0;overflow:auto;margin:0;padding:8px 10px;font:11.5px/1.5 var(--mono);white-space:pre;background:var(--bg)}
#memory b{color:var(--accent);font-weight:600}
#memoryNote{padding:7px 10px;font-size:11.5px;line-height:1.45;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel)}
#memory .ok{color:var(--ok)} #memory .bad{color:var(--err)} #memory .dim{color:var(--muted)}
footer{grid-column:1/-1;display:flex;align-items:stretch;height:35px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.empty{display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:12px;white-space:nowrap}
.block{display:flex;align-items:center;gap:3px;flex:none;height:100%;padding:0 6px;border-right:1px solid var(--g-edge);background:var(--g-fill)}
.block:first-child{border-left:1px solid var(--g-edge)}
.block>b{color:var(--g-ink);font-weight:650;font-size:11px;margin-right:2px;white-space:nowrap}
.block label{font-size:11px;color:var(--muted);white-space:nowrap}
.block input{width:47px;height:25px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font:11px var(--mono);text-align:right}
.block input:disabled{opacity:.5}
.block select{height:25px;padding:0 3px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:11px}
.b-pos{--g-edge:#8caee2;--g-fill:#eaf2ff;--g-ink:#245596}
.b-size{--g-edge:#91c5a7;--g-fill:#ecf8f0;--g-ink:#276f45}
.b-rot{--g-edge:#dab37b;--g-fill:#fff4e4;--g-ink:#975a1e}
.b-edge{--g-edge:#c29bd6;--g-fill:#f7efff;--g-ink:#6b3590}
[data-theme="dark"] .b-pos{--g-edge:#385c90;--g-fill:#21344e;--g-ink:#a6caff}
[data-theme="dark"] .b-size{--g-edge:#396b55;--g-fill:#203b2f;--g-ink:#a9e7c0}
[data-theme="dark"] .b-rot{--g-edge:#805e3b;--g-fill:#423224;--g-ink:#ffd2a0}
[data-theme="dark"] .b-edge{--g-edge:#6b4c80;--g-fill:#2e2238;--g-ink:#dcb8f2}
#profileSvg{width:30px;height:30px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:3px}
#history{margin-left:auto;display:flex;align-items:center;gap:2px;padding:0 6px;position:sticky;right:0;background:var(--panel)}
#history button{height:26px;width:30px;padding:0;font-size:15px;border:1px solid var(--line);border-radius:3px;background:var(--bg);cursor:pointer}
#history button:disabled{opacity:.38;cursor:default}
.hide{display:none!important}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <span class="brand">Snark_00</span>
  <details class="menu" id="fileMenu"><summary data-t="file"></summary>
    <div class="items">
      <button id="mNew" data-t="new"></button>
      <button id="mDemo" data-t="demo"></button>
      <button id="mOpen" data-t="open"></button>
      <button id="mSave" data-t="save"></button>
      <hr>
      <button id="mObj" data-t="exportObj"></button>
      <button id="mStl" data-t="exportStl"></button>
    </div>
  </details>
  <details class="menu" id="viewMenu"><summary data-t="view"></summary>
    <div class="items">
      <label><input type="radio" name="mode" value="snark" checked><span data-t="modeSnark"></span></label>
      <label><input type="radio" name="mode" value="obj"><span data-t="modeObj"></span></label>
      <hr>
      <label><input type="checkbox" id="vPatches"><span data-t="patches"></span></label>
      <label><input type="checkbox" id="vEdges" checked><span data-t="edgesLines"></span></label>
      <label><input type="checkbox" id="vWire"><span data-t="wire"></span></label>
      <label><input type="checkbox" id="vLabels"><span data-t="labels"></span></label>
      <hr>
      <button id="vFit" data-t="fit"></button>
    </div>
  </details>
  <div id="status"></div>
  <div class="top-right">
    <span class="lbl" data-t="chord"></span>
    <select id="chord" data-tt="chordT">
      <option value="0.5">0.5 mm</option><option value="0.1">0.1 mm</option><option value="0.05" selected>0.05 mm</option>
      <option value="0.01">0.01 mm</option><option value="0.001">0.001 mm</option>
    </select>
    <button id="bText" data-t="text"></button>
    <button id="bMemory" data-t="memory"></button>
    <button id="bTheme">☾</button>
    <select id="lang"><option value="ka">KA</option><option value="en">EN</option></select>
  </div>
  <input id="file" type="file" accept=".snark,.obj,.txt" class="hide">
</header>

<aside id="tools">
  <button id="tBox" data-tt="box"><svg viewBox="0 0 16 16"><path d="M8 1.6 13.8 4.6v6.8L8 14.4 2.2 11.4V4.6z"/><path d="M2.2 4.6 8 7.6l5.8-3M8 7.6v6.8"/></svg></button>
  <button id="tCyl" data-tt="cyl"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4"/></svg></button>
  <button id="tSph" data-tt="sph"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></svg></button>
  <hr>
  <button id="tDup" data-tt="dup"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg></button>
  <button id="tDel" data-tt="del"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <hr>
  <button id="tFit" data-tt="fit"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><rect x="5.5" y="5.5" width="5" height="5"/></svg></button>
</aside>

<section id="viewWrap">
  <canvas id="view"></canvas>
  <div id="objectStrip"></div>
</section>

<aside id="side" class="open">
  <div class="tabs">
    <button id="tabText" data-t="text" class="on"></button>
    <button id="tabMemory" data-t="memory"></button>
    <span class="sp"></span>
    <button class="x" id="sideClose">✕</button>
  </div>
  <div class="pane on" id="paneText">
    <textarea id="text" spellcheck="false" wrap="off"></textarea>
    <div class="bar"><span id="textNote"></span><span style="flex:1"></span>
      <button id="textRevert" data-t="revert" disabled></button><button id="textApply" class="primary" data-t="apply" disabled></button></div>
    <div id="issues"></div>
  </div>
  <div class="pane" id="paneMemory"><div id="memoryNote"></div><pre id="memory"></pre></div>
</aside>

<footer>
  <div id="noSel" class="empty" data-t="nosel"></div>
  <div class="block b-pos hide" id="bPos"><b data-t="center"></b>
    <label>X</label><input id="p0"><label>Y</label><input id="p1"><label>Z</label><input id="p2"></div>
  <div class="block b-size hide" id="bSize"><b data-t="size"></b>
    <label id="ls0">X</label><input id="s0"><label id="ls1">Y</label><input id="s1"><label id="ls2">Z</label><input id="s2"></div>
  <div class="block b-rot hide" id="bRot"><b data-t="rot"></b>
    <label>X</label><input id="r0"><label>Y</label><input id="r1"><label>Z</label><input id="r2"></div>
  <div class="block b-edge hide" id="bEdge"><b data-t="edge"></b>
    <select id="eRule"></select>
    <label data-t="setback" data-tt="setbackT"></label><input id="eT" data-tt="setbackT">
    <label id="lK" data-t="fullness"></label><input id="eK" data-tt="fullnessT">
    <select id="eSet"></select>
    <svg id="profileSvg" viewBox="0 0 30 30"></svg>
  </div>
  <div id="history"><button id="undo" data-tt="undo" disabled>↶</button><button id="redo" data-tt="redo" disabled>↷</button></div>
</footer>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════════════════
   Snark core — reference code for the Snark draft 0.1 subset used by Snark_00.

     objects ──build──▶ SnarkDoc ──write──▶ .snark text
     .snark text ──parse──▶ SnarkDoc ──recognise──▶ bodies ──evaluate──▶ surfaces

   SnarkDoc is the file held in memory. Everything the text says is in it;
   the text is only its written form. No DOM and no three.js in this file.
   ═══════════════════════════════════════════════════════════════════════════ */

const VERSION = '0.1';

/* ───────────── numbers and vectors ───────────── */
const fmt = x => {
  if (!Number.isFinite(x)) return 'NaN';
  const s = (Math.round(x * 1e6) / 1e6).toFixed(6).replace(/\.?0+$/, '');
  return s === '-0' ? '0' : s;
};
const fmtV = v => v.map(fmt).join(',');
const fmt9 = x => { const s = (Math.round(x * 1e9) / 1e9).toFixed(9).replace(/\.?0+$/, ''); return s === '-0' ? '0' : s; };   // rotations need more digits
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => { const l = len(a); return l > 1e-15 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; };
const vec = { add, sub, mul, dot, cross, len, unit };

/* Rotations. Euler angles are in degrees, order XYZ (as three.js).
   A frame is [ex, ey, ez]: the object's own axes written in world coordinates. */
const Rot = {
  quatFromEuler([x, y, z]) {
    const r = Math.PI / 360, c1 = Math.cos(x * r), c2 = Math.cos(y * r), c3 = Math.cos(z * r),
      s1 = Math.sin(x * r), s2 = Math.sin(y * r), s3 = Math.sin(z * r);
    return [s1 * c2 * c3 + c1 * s2 * s3, c1 * s2 * c3 - s1 * c2 * s3, c1 * c2 * s3 + s1 * s2 * c3, c1 * c2 * c3 - s1 * s2 * s3];
  },
  frameFromQuat(q) {
    const [x, y, z, w] = q, n = Math.hypot(x, y, z, w) || 1, X = x / n, Y = y / n, Z = z / n, W = w / n;
    const x2 = X + X, y2 = Y + Y, z2 = Z + Z, xx = X * x2, xy = X * y2, xz = X * z2, yy = Y * y2, yz = Y * z2, zz = Z * z2,
      wx = W * x2, wy = W * y2, wz = W * z2;
    return [[1 - (yy + zz), xy + wz, xz - wy], [xy - wz, 1 - (xx + zz), yz + wx], [xz + wy, yz - wx, 1 - (xx + yy)]];
  },
  quatFromFrame(F) {
    const m11 = F[0][0], m12 = F[1][0], m13 = F[2][0], m21 = F[0][1], m22 = F[1][1], m23 = F[2][1], m31 = F[0][2], m32 = F[1][2], m33 = F[2][2];
    const tr = m11 + m22 + m33; let x, y, z, w, s;
    if (tr > 0) { s = 0.5 / Math.sqrt(tr + 1); w = 0.25 / s; x = (m32 - m23) * s; y = (m13 - m31) * s; z = (m21 - m12) * s; }
    else if (m11 > m22 && m11 > m33) { s = 2 * Math.sqrt(1 + m11 - m22 - m33); w = (m32 - m23) / s; x = 0.25 * s; y = (m12 + m21) / s; z = (m13 + m31) / s; }
    else if (m22 > m33) { s = 2 * Math.sqrt(1 + m22 - m11 - m33); w = (m13 - m31) / s; x = (m12 + m21) / s; y = 0.25 * s; z = (m23 + m32) / s; }
    else { s = 2 * Math.sqrt(1 + m33 - m11 - m22); w = (m21 - m12) / s; x = (m13 + m31) / s; y = (m23 + m32) / s; z = 0.25 * s; }
    if (w < 0) { x = -x; y = -y; z = -z; w = -w; }
    return [x, y, z, w];
  },
  eulerFromFrame(F) {
    const m11 = F[0][0], m12 = F[1][0], m13 = F[2][0], m22 = F[1][1], m23 = F[2][1], m32 = F[1][2], m33 = F[2][2];
    const y = Math.asin(Math.max(-1, Math.min(1, m13))); let x, z;
    if (Math.abs(m13) < 0.9999999) { x = Math.atan2(-m23, m33); z = Math.atan2(-m12, m11); }
    else { x = Math.atan2(m32, m22); z = 0; }
    const d = 180 / Math.PI, c = v => { const r = Math.round(v * d * 1e9) / 1e9; return Object.is(r, -0) ? 0 : r; };
    return [c(x), c(y), c(z)];
  },
  frameFromEuler(e) { return Rot.frameFromQuat(Rot.quatFromEuler(e)); },
  isIdentity(q) { return Math.abs(q[0]) < 1e-12 && Math.abs(q[1]) < 1e-12 && Math.abs(q[2]) < 1e-12; },
};
const local = (c, F, l) => [c[0] + F[0][0] * l[0] + F[1][0] * l[1] + F[2][0] * l[2],
  c[1] + F[0][1] * l[0] + F[1][1] * l[1] + F[2][1] * l[2], c[2] + F[0][2] * l[0] + F[1][2] * l[1] + F[2][2] * l[2]];

/* ═══════════════════ 1. SnarkDoc: the file in memory ═══════════════════ */
function newDoc() {
  return {
    version: VERSION,
    header: { units: 'mm', up: 'z', tol: 0.001, chord: null, detail: 1, mesh: 'final', source: 'design',
      uses: [], edge: { kind: 'sharp' }, edge_angle: 30, blend: 'mix:1', extra: {} },
    meta: {},            // free text: title, author, tool, date
    preamble: [],        // comments at the top of the file
    pos: [],             // vertex coordinates: x,y,z, x,y,z, … (vertex i at 3·i)
    faces: [],           // { v:[i,j,k] or [i,j,k,l] (0-based), patch:'name' }
    patches: new Map(),  // name → { name, card, faces:[face indices], note }
    edges: [],           // { a, b, rule, note }                   #@edge
    profiles: new Map(), // id → { id, start:[x,h], segs:[…], note } #@profile
    recipe: [],          // { id, op, prim, dims, p, q, of, group, name, note }
    seams: [], curves: [], features: [], patterns: [], creases: [], levels: [], unknown: [], // kept as written (raw)
    ignored: {},         // plain-OBJ lines that Snark does not use (vn, vt, o, s…)
    issues: [],          // { level:'error'|'warn'|'info'|'boojum', line, msg }
  };
}

/* ═══════════════════ 2. text → SnarkDoc (reader) ═══════════════════ */
function tokenize(s) {

$('file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { loadText(await f.text()); } catch (err) { alert(t('openErr') + err.message); } };
$('mSave').onclick = () => download('scene.snark', PIPE.text, 'text/plain');
$('mObj').onclick = () => { const fd = buildFinalDoc(S, VIEW.chord); download('scene_final.obj', writeSnark(fd), 'text/plain'); };
$('mStl').onclick = () => { const ev = evaluate(PIPE.doc2, VIEW.chord, PIPE.rec); download('scene.stl', stlBytes(ev.bodies.map(b => weld(b.pieces))), 'model/stl'); };

/* ── language and theme ── */
function applyLang() {
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-tt]')) el.title = t(el.dataset.tt);
  $('lang').value = LANG;
  if (PIPE) { setTextNote(); status(); renderChips(); updateInspector(); drawMemory(); showIssues(); }
}
$('lang').onchange = e => { LANG = e.target.value; store.set('lang', LANG); applyLang(); };
function theme(th) { document.documentElement.dataset.theme = th; $('bTheme').textContent = th === 'dark' ? '☀' : '☾'; store.set('theme', th); if (ROOM) { ROOM.key = ''; refreshRoom(); } if (PIPE) evaluateAndDraw(); }
$('bTheme').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ── start ── */
LANG = store.get('lang', 'ka');
theme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
applyLang(); sidePane('text');
S.objects = demoObjects(); S.objects.forEach(o => o.q = Rot.quatFromEuler(o.rot)); S.nextId = 4; S.meta = { title: 'Snark_00 demo', made_by: 'Snark_00' };
commit(); rebuild(); resize(); refreshRoom(true); fitView();

window.__snark = { THREE, S, get PIPE() { return PIPE; }, get READ() { return READ; }, VIEW, parseSnark, writeSnark, buildDoc, docToState, recognise, evaluate, weld, meshStats, buildFinalDoc,
  loadText, select, rebuild, camera, controls, canvas, fitView, get SEL() { return SEL; } };
</script>
