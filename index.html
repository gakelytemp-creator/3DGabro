<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <title>Deterministic 3D Local Read/Write with Euclidean Binding</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
      overflow: hidden;
    }
    #info {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.82);
      padding: 8px 10px;
      white-space: pre;
      line-height: 1.3;
      border: 1px solid #133;
      max-width: 420px;
    }
    #controls {
      position: fixed;
      right: 10px;
      top: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.82);
      padding: 10px 12px;
      border: 1px solid #133;
      min-width: 320px;
    }
    #controls label {
      display: block;
      margin-top: 8px;
      margin-bottom: 6px;
    }
    #controls input[type="range"] {
      width: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info"></div>

  <div id="controls">
    <label>
      ნაწილაკების რაოდენობა:
      <span id="particleCountLabel"></span>
    </label>
    <input id="particleSlider" type="range" min="4" max="120" step="1" value="36" />

    <label>
      მიზიდულობის არე (SIGMA):
      <span id="sigmaLabel"></span>
    </label>
    <input id="sigmaSlider" type="range" min="4" max="80" step="1" value="24" />

    <label>
      ჩაწერის სიძლიერე (WRITE_AMOUNT):
      <span id="writeLabel"></span>
    </label>
    <input id="writeSlider" type="range" min="0.00" max="0.30" step="0.005" value="0.08" />

    <div style="margin-top:10px;">
      Space = pause/run<br>
      S = ერთი ნაბიჯი pause-ზე<br>
      R = ახალი შემთხვევითი სამყარო
    </div>
  </div>

  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");

    const particleSlider = document.getElementById("particleSlider");
    const particleCountLabel = document.getElementById("particleCountLabel");

    const sigmaSlider = document.getElementById("sigmaSlider");
    const sigmaLabel = document.getElementById("sigmaLabel");

    const writeSlider = document.getElementById("writeSlider");
    const writeLabel = document.getElementById("writeLabel");

    const GRID = 576;
    let PARTICLES = parseInt(particleSlider.value, 10);

    let WRITE_AMOUNT = parseFloat(writeSlider.value);
    const SPEED_LIMIT = 1.2;

    let SIGMA = parseInt(sigmaSlider.value, 10);
    let SIGMA2 = SIGMA * SIGMA;

    let W = 0, H = 0;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const Bx = new Float32Array(GRID);
    const By = new Float32Array(GRID);
    const Bz = new Float32Array(GRID);

    function wrapIndex(i) {
      return ((i % GRID) + GRID) % GRID;
    }

    function wrapPos(v) {
      v = v % GRID;
      if (v < 0) v += GRID;
      return v;
    }

    function signedToroidalDelta(a, b) {
      let d = b - a;
      if (d > GRID / 2) d -= GRID;
      if (d < -GRID / 2) d += GRID;
      return d;
    }

    function clampSpeed(v) {
      if (v > SPEED_LIMIT) return SPEED_LIMIT;
      if (v < -SPEED_LIMIT) return -SPEED_LIMIT;
      return v;
    }

    function torusDistance2(a, b) {
      const dx = signedToroidalDelta(a.x, b.x);
      const dy = signedToroidalDelta(a.y, b.y);
      const dz = signedToroidalDelta(a.z, b.z);
      return dx * dx + dy * dy + dz * dz;
    }

    const particles = [];

    function updateLabels() {
      particleCountLabel.textContent = PARTICLES;
      sigmaLabel.textContent = SIGMA;
      writeLabel.textContent = WRITE_AMOUNT.toFixed(3);
    }

    function clearFields() {
      for (let i = 0; i < GRID; i++) {
        Bx[i] = 0;
        By[i] = 0;
        Bz[i] = 0;
      }
    }

    function resetWorld() {
      clearFields();
      particles.length = 0;

      for (let i = 0; i < PARTICLES; i++) {
        particles.push({
          x: Math.random() * GRID,
          y: Math.random() * GRID,
          z: Math.random() * GRID,
          vx: (Math.random() * 2 - 1) * 0.35,
          vy: (Math.random() * 2 - 1) * 0.35,
          vz: (Math.random() * 2 - 1) * 0.35,
          sign: Math.random() < 0.5 ? 1 : -1,
          color: `hsl(${(360 * i) / Math.max(1, PARTICLES)}, 90%, 60%)`
        });
      }

      tickCount = 0;
      updateLabels();
    }

    function readParticleField(particleIndex) {
      const p = particles[particleIndex];

      let fx = 0;
      let fy = 0;
      let fz = 0;
      let density = 0;

      for (let j = 0; j < particles.length; j++) {
        if (j === particleIndex) continue;

        const q = particles[j];
        const dx = signedToroidalDelta(p.x, q.x);
        const dy = signedToroidalDelta(p.y, q.y);
        const dz = signedToroidalDelta(p.z, q.z);

        const r2 = dx * dx + dy * dy + dz * dz;
        if (r2 < 1e-9) continue;

        const gate = Math.exp(-r2 / SIGMA2);
        const s = q.sign;

        fx += s * dx * gate;
        fy += s * dy * gate;
        fz += s * dz * gate;
        density += gate;
      }

      return { fx, fy, fz, density };
    }

    function writeLocal(buffer, pos, amount) {
      const p = Math.floor(pos);
      buffer[wrapIndex(p)] += amount;
      buffer[wrapIndex(p - 1)] += amount * 0.35;
      buffer[wrapIndex(p + 1)] += amount * 0.35;
    }

    let tickCount = 0;
    let running = true;

    function step() {
      tickCount++;

      const reads = particles.map((_, i) => readParticleField(i));

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const r = reads[i];

        let ax = 0.0045 * r.fx;
        let ay = 0.0045 * r.fy;
        let az = 0.0045 * r.fz;

        p.vx = clampSpeed(p.vx + ax);
        p.vy = clampSpeed(p.vy + ay);
        p.vz = clampSpeed(p.vz + az);

        p.x = wrapPos(p.x + p.vx);
        p.y = wrapPos(p.y + p.vy);
        p.z = wrapPos(p.z + p.vz);
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const amt = WRITE_AMOUNT * p.sign;
        writeLocal(Bx, p.x, amt);
        writeLocal(By, p.y, amt);
        writeLocal(Bz, p.z, amt);
      }
    }

    function drawFieldStrip(buffer, x, y, w, h, label) {
      ctx.strokeStyle = "#133";
      ctx.strokeRect(x, y, w, h);

      let maxAbs = 0.001;
      for (let i = 0; i < GRID; i++) {
        const a = Math.abs(buffer[i]);
        if (a > maxAbs) maxAbs = a;
      }

      const cellW = w / GRID;
      for (let i = 0; i < GRID; i++) {
        const v = buffer[i] / maxAbs;
        const px = x + i * cellW;

        if (v >= 0) {
          const g = Math.floor(255 * Math.min(1, v));
          ctx.fillStyle = `rgb(${g},${g},0)`;
        } else {
          const b = Math.floor(255 * Math.min(1, -v));
          ctx.fillStyle = `rgb(0,${b},${b})`;
        }
        ctx.fillRect(px, y, Math.ceil(cellW) + 1, h);
      }

      ctx.fillStyle = "#0f0";
      ctx.fillText(label, x + 6, y + 16);
    }

    function drawParticlesXY(x, y, w, h) {
      ctx.strokeStyle = "#133";
      ctx.strokeRect(x, y, w, h);

      ctx.strokeStyle = "#0b1a1a";
      for (let i = 0; i <= 8; i++) {
        const gx = x + (i / 8) * w;
        const gy = y + (i / 8) * h;
        ctx.beginPath();
        ctx.moveTo(gx, y);
        ctx.lineTo(gx, y + h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, gy);
        ctx.lineTo(x + w, gy);
        ctx.stroke();
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const sx = x + (p.x / GRID) * w;
        const sy = y + h - (p.y / GRID) * h;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(sx, sy, i === 0 ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fill();

        if (i < 20) {
          ctx.fillStyle = "#fff";
          ctx.fillText(String(i), sx + 5, sy - 5);
        }
      }

      ctx.fillStyle = "#0f0";
      ctx.fillText("XY პროექცია", x + 6, y + 16);
    }

    function drawPairLinks(x, y, w, h) {
      const thresholdR2 = SIGMA * SIGMA;
      ctx.strokeStyle = "rgba(80,180,255,0.10)";
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p = particles[i];
          const q = particles[j];
          const r2 = torusDistance2(p, q);
          if (r2 > thresholdR2) continue;

          const sx1 = x + (p.x / GRID) * w;
          const sy1 = y + h - (p.y / GRID) * h;
          const sx2 = x + (q.x / GRID) * w;
          const sy2 = y + h - (q.y / GRID) * h;

          ctx.beginPath();
          ctx.moveTo(sx1, sy1);
          ctx.lineTo(sx2, sy2);
          ctx.stroke();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const topH = Math.floor(H * 0.68);
      const stripH = Math.floor((H - topH - 40) / 3);
      const margin = 20;

      drawParticlesXY(margin, margin, W - margin * 2, topH - margin * 2);
      drawPairLinks(margin, margin, W - margin * 2, topH - margin * 2);

      drawFieldStrip(Bx, margin, topH + 4, W - margin * 2, stripH, "Bx");
      drawFieldStrip(By, margin, topH + 8 + stripH, W - margin * 2, stripH, "By");
      drawFieldStrip(Bz, margin, topH + 12 + stripH * 2, W - margin * 2, stripH, "Bz");

      const p0 = particles[0];
      const r0 = p0 ? readParticleField(0) : { fx: 0, fy: 0, fz: 0, density: 0 };

      info.textContent =
`deterministic local read/write + Euclidean binding

GRID = ${GRID}
particles = ${PARTICLES}
SIGMA = ${SIGMA}
WRITE_AMOUNT = ${WRITE_AMOUNT.toFixed(3)}
randomness = initial state only
NOISE = 0
DECAY = 0
DAMPING = 0
tick = ${tickCount}

particle 0
x=${p0 ? p0.x.toFixed(2) : "-"}  y=${p0 ? p0.y.toFixed(2) : "-"}  z=${p0 ? p0.z.toFixed(2) : "-"}
vx=${p0 ? p0.vx.toFixed(3) : "-"} vy=${p0 ? p0.vy.toFixed(3) : "-"} vz=${p0 ? p0.vz.toFixed(3) : "-"}

field read for p0
fx=${r0.fx.toFixed(3)}
fy=${r0.fy.toFixed(3)}
fz=${r0.fz.toFixed(3)}
density=${r0.density.toFixed(3)}`;
    }

    particleSlider.addEventListener("input", () => {
      PARTICLES = parseInt(particleSlider.value, 10);
      updateLabels();
    });

    particleSlider.addEventListener("change", () => {
      PARTICLES = parseInt(particleSlider.value, 10);
      resetWorld();
    });

    sigmaSlider.addEventListener("input", () => {
      SIGMA = parseInt(sigmaSlider.value, 10);
      SIGMA2 = SIGMA * SIGMA;
      updateLabels();
    });

    writeSlider.addEventListener("input", () => {
      WRITE_AMOUNT = parseFloat(writeSlider.value);
      updateLabels();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        running = !running;
      }
      if ((e.key === "s" || e.key === "S") && !running) {
        step();
        draw();
      }
      if (e.key === "r" || e.key === "R") {
        resetWorld();
      }
    });

    updateLabels();
    resetWorld();

    function loop() {
      if (running) step();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
